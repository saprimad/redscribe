name: Benchmark runner synthetic tests

on:
  push:
    branches:
      - redscribe-benchmark-timeline
      - refactor/benchmark-architecture
    paths:
      - "benchmark_*.py"
      - "redscribe/**"
      - "benchmark*.py"
      - "tests/test_benchmark*.py"
      - ".github/workflows/benchmark-tests.yml"
  pull_request:
    branches:
      - redscribe-benchmark-timeline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-benchmark-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only dependencies
        run: python -m pip install python-docx
      - name: Compile benchmark modules
        run: python -m compileall -q benchmark_config.py benchmark_metrics.py benchmark_reporting.py benchmark_excel.py benchmark_ground_truth.py benchmark_reference.py benchmark_reference_ui.py benchmark_pilot.py benchmark_batch.py benchmark_ui.py benchmark_batch_ui.py benchmark_resources.py benchmark_speech.py redscribe tests
      - name: Synthetic benchmark tests (no model downloads)
        run: python -m unittest discover -s tests -p "test_benchmark*.py" -v

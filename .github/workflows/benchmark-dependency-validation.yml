name: Benchmark dependency validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt -r requirements-benchmark.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Import runtime libraries
        run: python -c "import torch, torchaudio, faster_whisper, pyannote.audio, soundfile, keyring, openpyxl, docx, matplotlib, rapidfuzz, jiwer; print(torch.__version__)"
      - name: Record resolved versions
        run: python -m pip freeze

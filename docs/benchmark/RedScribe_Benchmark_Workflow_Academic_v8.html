<script>
const svg=document.getElementById('redscribe-flowchart');
function serialise(){const cp=svg.cloneNode(true);cp.removeAttribute('id');cp.setAttribute('xmlns','http://www.w3.org/2000/svg');return new XMLSerializer().serializeToString(cp)}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
document.getElementById('svgBtn').onclick=()=>download(new Blob([serialise()],{type:'image/svg+xml;charset=utf-8'}),'RedScribe_Benchmark_Workflow_Academic_v8.svg');
document.getElementById('pngBtn').onclick=()=>{const url=URL.createObjectURL(new Blob([serialise()],{type:'image/svg+xml;charset=utf-8'})),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=3640;c.height=3064;const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>download(b,'RedScribe_Benchmark_Workflow_Academic_v8.png'),'image/png');URL.revokeObjectURL(url)};img.src=url;};
document.getElementById('printBtn').onclick=()=>window.print();

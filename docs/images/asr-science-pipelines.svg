<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="650" viewBox="0 0 1080 650"><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="32" y="38" font-size="25" font-weight="bold">Three ASR processing pathways</text><text x="32" y="63" font-size="14" fill="#475569">Conceptual architecture, not an execution trace or measured neural activation.</text><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#64748b"/></marker></defs><text x="190" y="105" text-anchor="middle" font-size="19" font-weight="bold">CTC</text><rect x="32" y="125" width="316" height="58" rx="8" fill="#d5f0e8"/><text x="190" y="147" text-anchor="middle" font-size="15" font-weight="bold">Waveform</text><text x="190" y="168" text-anchor="middle" font-size="12">Resampled speech</text><path d="M190 183 L190 212" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="213" width="316" height="58" rx="8" fill="#d5f0e8"/><text x="190" y="235" text-anchor="middle" font-size="15" font-weight="bold">Convolutional encoder</text><text x="190" y="256" text-anchor="middle" font-size="12">Learned acoustic features</text><path d="M190 271 L190 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="301" width="316" height="58" rx="8" fill="#d5f0e8"/><text x="190" y="323" text-anchor="middle" font-size="15" font-weight="bold">Contextual Transformer</text><text x="190" y="344" text-anchor="middle" font-size="12">Acoustic context</text><path d="M190 359 L190 388" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="389" width="316" height="58" rx="8" fill="#d5f0e8"/><text x="190" y="411" text-anchor="middle" font-size="15" font-weight="bold">Frame-label projection</text><text x="190" y="432" text-anchor="middle" font-size="12">Parallel probabilities + blank</text><path d="M190 447 L190 476" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="477" width="316" height="58" rx="8" fill="#d5f0e8"/><text x="190" y="499" text-anchor="middle" font-size="15" font-weight="bold">CTC collapse / decoding</text><text x="190" y="520" text-anchor="middle" font-size="12">Merge repeats, remove blanks</text><path d="M190 535 L190 565" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="32" y="566" width="316" height="56" rx="8" fill="#eef2f6"/><text x="190" y="588" text-anchor="middle" font-size="15" font-weight="bold">Transcript</text><text x="190" y="609" text-anchor="middle" font-size="12">Requires human verification</text><text x="540" y="105" text-anchor="middle" font-size="19" font-weight="bold">Whisper encoder–decoder</text><rect x="382" y="125" width="316" height="58" rx="8" fill="#dce9fa"/><text x="540" y="147" text-anchor="middle" font-size="15" font-weight="bold">Waveform</text><text x="540" y="168" text-anchor="middle" font-size="12">Resampled speech</text><path d="M540 183 L540 212" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="382" y="213" width="316" height="58" rx="8" fill="#dce9fa"/><text x="540" y="235" text-anchor="middle" font-size="15" font-weight="bold">Log-Mel features</text><text x="540" y="256" text-anchor="middle" font-size="12">Time-frequency representation</text><path d="M540 271 L540 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="382" y="301" width="316" height="58" rx="8" fill="#dce9fa"/><text x="540" y="323" text-anchor="middle" font-size="15" font-weight="bold">Audio Transformer</text><text x="540" y="344" text-anchor="middle" font-size="12">Contextual acoustic encoding</text><path d="M540 359 L540 388" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="382" y="389" width="316" height="58" rx="8" fill="#dce9fa"/><text x="540" y="411" text-anchor="middle" font-size="15" font-weight="bold">Text decoder</text><text x="540" y="432" text-anchor="middle" font-size="12">Self- and cross-attention</text><path d="M540 447 L540 476" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="382" y="477" width="316" height="58" rx="8" fill="#dce9fa"/><text x="540" y="499" text-anchor="middle" font-size="15" font-weight="bold">Autoregressive generation</text><text x="540" y="520" text-anchor="middle" font-size="12">Previous tokens condition next token</text><path d="M540 535 L540 565" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="382" y="566" width="316" height="56" rx="8" fill="#eef2f6"/><text x="540" y="588" text-anchor="middle" font-size="15" font-weight="bold">Transcript</text><text x="540" y="609" text-anchor="middle" font-size="12">Requires human verification</text><text x="890" y="105" text-anchor="middle" font-size="19" font-weight="bold">Audio–LLM</text><rect x="732" y="125" width="316" height="58" rx="8" fill="#f9ead4"/><text x="890" y="147" text-anchor="middle" font-size="15" font-weight="bold">Waveform</text><text x="890" y="168" text-anchor="middle" font-size="12">Resampled speech</text><path d="M890 183 L890 212" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="732" y="213" width="316" height="58" rx="8" fill="#f9ead4"/><text x="890" y="235" text-anchor="middle" font-size="15" font-weight="bold">Acoustic features</text><text x="890" y="256" text-anchor="middle" font-size="12">Time-frequency representation</text><path d="M890 271 L890 300" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="732" y="301" width="316" height="58" rx="8" fill="#f9ead4"/><text x="890" y="323" text-anchor="middle" font-size="15" font-weight="bold">Audio encoder</text><text x="890" y="344" text-anchor="middle" font-size="12">Contextual acoustic encoding</text><path d="M890 359 L890 388" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="732" y="389" width="316" height="58" rx="8" fill="#f9ead4"/><text x="890" y="411" text-anchor="middle" font-size="15" font-weight="bold">Modality connection</text><text x="890" y="432" text-anchor="middle" font-size="12">Audio representation for LM</text><path d="M890 447 L890 476" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="732" y="477" width="316" height="58" rx="8" fill="#f9ead4"/><text x="890" y="499" text-anchor="middle" font-size="15" font-weight="bold">Language model generation</text><text x="890" y="520" text-anchor="middle" font-size="12">Autoregressive output</text><path d="M890 535 L890 565" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="732" y="566" width="316" height="56" rx="8" fill="#eef2f6"/><text x="890" y="588" text-anchor="middle" font-size="15" font-weight="bold">Transcript</text><text x="890" y="609" text-anchor="middle" font-size="12">Requires human verification</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="100%" height="100%" fill="white"/><g font-family="Arial,sans-serif" fill="#172033"><text x="30" y="38" font-size="25" font-weight="bold">Coverage and verification for long-form ASR</text><text x="30" y="65" font-size="14">Illustrative intervals only; not evidence from a participant recording.</text><text x="30" y="105" font-size="17" font-weight="bold">A. Complete source-time coverage</text><rect x="30" y="122" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="106" y="146" text-anchor="middle" font-size="13">Chunk 1</text><rect x="187" y="122" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="263" y="146" text-anchor="middle" font-size="13">Chunk 2</text><rect x="344" y="122" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="420" y="146" text-anchor="middle" font-size="13">Chunk 3</text><rect x="501" y="122" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="577" y="146" text-anchor="middle" font-size="13">Chunk 4</text><rect x="658" y="122" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="734" y="146" text-anchor="middle" font-size="13">Chunk 5</text><rect x="815" y="122" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="891" y="146" text-anchor="middle" font-size="13">Chunk 6</text><text x="30" y="182" font-size="13">0 s</text><text x="972" y="182" font-size="13" text-anchor="end">End of recording</text><text x="30" y="221" font-size="17" font-weight="bold">B. Missing interval: distinguish failure from intentional exclusion</text><rect x="30" y="238" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="106" y="262" text-anchor="middle" font-size="13">Processed</text><rect x="187" y="238" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="263" y="262" text-anchor="middle" font-size="13">Processed</text><rect x="344" y="238" width="152" height="39" rx="4" fill="#f9d6d6"/><text x="420" y="262" text-anchor="middle" font-size="13">Missing</text><rect x="501" y="238" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="577" y="262" text-anchor="middle" font-size="13">Processed</text><rect x="658" y="238" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="734" y="262" text-anchor="middle" font-size="13">Processed</text><rect x="815" y="238" width="152" height="39" rx="4" fill="#b5e4d4"/><text x="891" y="262" text-anchor="middle" font-size="13">Processed</text><text x="30" y="304" font-size="14">Coverage = union of successfully processed intervals / original duration; do not count overlap twice.</text><text x="30" y="350" font-size="17" font-weight="bold">C. Verification gates</text><rect x="30" y="370" width="220" height="65" rx="6" fill="#dce9fa"/><text x="140" y="398" text-anchor="middle" font-size="15" font-weight="bold">Source audio</text><text x="140" y="418" text-anchor="middle" font-size="12">Duration and chunks</text><path d="M250 402 h18 l-5 -4 m5 4 l-5 4" stroke="#64748b" fill="none"/><rect x="270" y="370" width="220" height="65" rx="6" fill="#dce9fa"/><text x="380" y="398" text-anchor="middle" font-size="15" font-weight="bold">ASR hypothesis</text><text x="380" y="418" text-anchor="middle" font-size="12">Model and decoder</text><path d="M490 402 h18 l-5 -4 m5 4 l-5 4" stroke="#64748b" fill="none"/><rect x="510" y="370" width="220" height="65" rx="6" fill="#dce9fa"/><text x="620" y="398" text-anchor="middle" font-size="15" font-weight="bold">Reference alignment</text><text x="620" y="418" text-anchor="middle" font-size="12">WER / CER / S D I</text><path d="M730 402 h18 l-5 -4 m5 4 l-5 4" stroke="#64748b" fill="none"/><rect x="750" y="370" width="220" height="65" rx="6" fill="#dce9fa"/><text x="860" y="398" text-anchor="middle" font-size="15" font-weight="bold">Human review</text><text x="860" y="418" text-anchor="middle" font-size="12">Dialect and speakers</text><text x="30" y="478" font-size="14">A completed run is not proof of full coverage, correct recognition or reliable speaker attribution.</text></g></svg>
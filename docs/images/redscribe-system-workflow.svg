<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1000" viewBox="0 0 1480 1000" role="img" aria-labelledby="title desc">
<title id="title">RedScribe workflow: one recording, two research files</title>
<desc id="desc">One recording enters local processing, configured by run settings. Optional speaker diarisation precedes transcription and can be bypassed. A structured transcript and descriptive summaries are exported to both Word and Excel for researcher verification.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#196079"/></marker><style>text{font-family:Arial,Helvetica,sans-serif}.flow{fill:none;stroke:#196079;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect x="0" y="0" width="1480" height="1000" fill="#fff" stroke="none" stroke-width="1.5" rx="0"/>
<rect x="30" y="30" width="7" height="54" fill="#8b2443" stroke="none" stroke-width="1.5" rx="3"/>
<text x="54" y="54" text-anchor="start" font-size="30" fill="#202e35" font-weight="700">RedScribe processing workflow</text>
<text x="54" y="84" text-anchor="start" font-size="20" fill="#52636d">One recording → local processing → Word and Excel</text>
<rect x="30" y="130" width="350" height="290" fill="#fff" stroke="#52636d" stroke-width="1.5" rx="0" stroke-dasharray="9 7"/>
<rect x="46" y="146" width="318" height="49" fill="#f5f8fa" stroke="#a7bac5" stroke-width="1.5" rx="0"/>
<text x="205.0" y="179" text-anchor="middle" font-size="24" fill="#202e35" font-weight="700">Input</text>
<rect x="54" y="229" width="302" height="125" fill="#929b9f" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="205.0" y="263" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">One recording file</text>
<text x="205.0" y="294" text-anchor="middle" font-size="18" fill="#fff">MP3 · WAV · M4A · MP4</text>
<text x="205.0" y="321" text-anchor="middle" font-size="18" fill="#fff">Audio, or audio from video</text>
<text x="205" y="391" text-anchor="middle" font-size="18" fill="#52636d">One file per transcription run</text>
<rect x="30" y="477" width="350" height="353" fill="#f5f8fa" stroke="#b6c5cc" stroke-width="1.5" rx="8"/>
<text x="54" y="515" text-anchor="start" font-size="24" fill="#202e35" font-weight="700">Run settings</text>
<text x="54" y="556" text-anchor="start" font-size="20" fill="#202e35">Study details (optional)</text>
<text x="54" y="588" text-anchor="start" font-size="18" fill="#52636d">Project · researcher · label · period</text>
<text x="54" y="643" text-anchor="start" font-size="20" fill="#202e35">Language and Whisper model</text>
<text x="54" y="675" text-anchor="start" font-size="18" fill="#52636d">Auto detect · Malay · English</text>
<text x="54" y="733" text-anchor="start" font-size="20" fill="#202e35">Speaker diarisation settings</text>
<text x="54" y="765" text-anchor="start" font-size="18" fill="#52636d">Enable / disable · speaker count</text>
<text x="54" y="796" text-anchor="start" font-size="18" fill="#52636d">Hugging Face access if enabled</text>
<path d="M54 608H356" stroke="#d4dfe4"/>
<path d="M54 697H356" stroke="#d4dfe4"/>
<rect x="430" y="130" width="600" height="700" fill="#fff" stroke="#52636d" stroke-width="1.5" rx="0" stroke-dasharray="9 7"/>
<rect x="446" y="146" width="568" height="49" fill="#f5f8fa" stroke="#a7bac5" stroke-width="1.5" rx="0"/>
<text x="730.0" y="179" text-anchor="middle" font-size="24" fill="#202e35" font-weight="700">Local processing</text>
<path d="M356 291H405V258H478" class="flow"/>
<rect x="478" y="219" width="504" height="78" fill="#196079" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="730.0" y="253" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Prepare session and load model</text>
<text x="730.0" y="284" text-anchor="middle" font-size="18" fill="#fff">CUDA where available · CPU fallback</text>
<path d="M730 297V335" class="flow"/>
<rect x="478" y="335" width="504" height="90" fill="#28643d" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="730.0" y="369" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Optional speaker diarisation</text>
<text x="730.0" y="400" text-anchor="middle" font-size="18" fill="#fff">pyannote.audio · estimate speaker turns</text>
<path d="M730 315H1007V448H730" class="flow" stroke-dasharray="7 5"/>
<path d="M730 425V465" class="flow"/>
<rect x="478" y="465" width="504" height="78" fill="#196079" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="730.0" y="499" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Faster-Whisper transcription</text>
<text x="730.0" y="530" text-anchor="middle" font-size="18" fill="#fff">Speech to text · segment timestamps</text>
<path d="M730 543V583" class="flow"/>
<rect x="478" y="583" width="504" height="103" fill="#196079" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="730.0" y="617" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Structure transcript and summaries</text>
<text x="730.0" y="648" text-anchor="middle" font-size="18" fill="#fff">Utterances · estimated times · speaker labels*</text>
<text x="730.0" y="675" text-anchor="middle" font-size="18" fill="#fff">Descriptive tables · charts · token frequencies</text>
<path d="M730 686V727" class="flow"/>
<rect x="478" y="727" width="504" height="67" fill="#196079" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="730.0" y="761" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Export both research files</text>
<rect x="1080" y="400" width="370" height="430" fill="#fff" stroke="#52636d" stroke-width="1.5" rx="0" stroke-dasharray="9 7"/>
<rect x="1096" y="416" width="338" height="49" fill="#f5f8fa" stroke="#a7bac5" stroke-width="1.5" rx="0"/>
<text x="1265.0" y="449" text-anchor="middle" font-size="24" fill="#202e35" font-weight="700">Two outputs</text>
<path d="M982 760H1054V557H1104" class="flow"/>
<path d="M1054 760V727H1104" class="flow"/>
<rect x="1104" y="493" width="322" height="129" fill="#196079" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="1265.0" y="527" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Word report (.docx)</text>
<text x="1265.0" y="558" text-anchor="middle" font-size="18" fill="#fff">Editable grouped transcript</text>
<text x="1265.0" y="585" text-anchor="middle" font-size="18" fill="#fff">Early report tables and charts</text>
<rect x="1104" y="663" width="322" height="129" fill="#196079" stroke="#24424f" stroke-width="1.5" rx="0"/>
<text x="1265.0" y="697" text-anchor="middle" font-size="22" fill="#fff" font-weight="700">Excel workbook (.xlsx)</text>
<text x="1265.0" y="728" text-anchor="middle" font-size="18" fill="#fff">Utterances and verification</text>
<text x="1265.0" y="755" text-anchor="middle" font-size="18" fill="#fff">Early_Report + Transcription</text>
<text x="30" y="870" text-anchor="start" font-size="18" fill="#52636d">Green stage: optional. Dashed route: bypass when disabled or unsuccessful.</text>
<text x="30" y="899" text-anchor="start" font-size="18" fill="#52636d">*Speaker labels depend on successful diarisation; timestamps are estimates.</text>
<rect x="30" y="925" width="1420" height="51" fill="#faf0f3" stroke="none" stroke-width="1.5" rx="6"/>
<text x="740" y="958" text-anchor="middle" font-size="20" fill="#78233d">Researcher verification: check words, timestamps and speaker labels against the original recording.</text>
</svg>
